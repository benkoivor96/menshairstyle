<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prijava</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #111;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #1A1A1A;
    border: 1px solid rgba(194,164,126,0.15);
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
  }
  .logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo img { height: 44px; width: auto; object-fit: contain; }
  .salon-name {
    color: #C2A47E;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    margin-top: 10px;
  }
  h2 {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 28px;
    text-align: center;
  }
  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #8A8A8A;
    margin-bottom: 7px;
  }
  input {
    width: 100%;
    padding: 11px 14px;
    background: #111;
    border: 1px solid rgba(194,164,126,0.2);
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #C2A47E; }
  .btn {
    width: 100%;
    height: 46px;
    margin-top: 8px;
    background: #C2A47E;
    color: #000;
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #a88d6a; }
  .error {
    background: rgba(224,90,90,0.1);
    border: 1px solid rgba(224,90,90,0.3);
    color: #e05a5a;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 4px;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="../logo.png" alt="Logo" onerror="this.style.display='none'">
    <div class="salon-name" id="salon-name">Admin Panel</div>
  </div>
  <h2>Prijava</h2>
  <div class="error" id="error-msg">Pogrešno korisničko ime ili lozinka.</div>
  <form id="login-form">
    <div class="form-group">
      <label>Korisničko ime</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label>Lozinka</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Prijavi se</button>
  </form>
</div>
<script>
  const BASE = window.BASE_PATH || '';

  fetch(BASE + '/api/config').then(r => r.json()).then(d => {
    if (d.salonName) document.getElementById('salon-name').textContent = d.salonName;
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch(BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    if (res.ok) {
      window.location.href = BASE + '/';
    } else {
      document.getElementById('error-msg').classList.add('show');
    }
  });
</script>
</body>
</html>
